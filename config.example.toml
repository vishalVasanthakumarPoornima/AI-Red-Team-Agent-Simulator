[redteam]
bind_host = "127.0.0.1"
api_port = 18150
report_root = "reports/runs"
inventory_cache = "reports/cache/inventory.json"
allowed_cidrs = ["127.0.0.0/8", "::1/128"]
allowed_domains = []
allowed_kali_aliases = []
allow_public = false
rate_limit_per_minute = 30
max_concurrency = 4
request_body_limit = 32768
request_timeout_seconds = 60
retention_days = 30
configured_agent_endpoints = ["http://127.0.0.1:18080"]
ollama_endpoints = ["http://127.0.0.1:11434"]
ollama_discovery_timeout = 1.5
ollama_live_check = false
metadata_response_size = 2000000
listener_discovery_method = "auto"
listener_cache_ttl_seconds = 30
include_udp = false
include_docker = false
include_stopped_containers = false
docker_timeout = 5
include_kali_readiness = false
kali_live_check = false
kali_readiness_timeout = 8
http_metadata_routes = ["/health", "/metadata", "/targets", "/openapi.json", "/v1/models"]
known_local_service_ports = [18080, 18101, 18102, 8000, 8080, 5000, 5001]
inventory_cache_ttl_seconds = 60
passive_only = true
default_ollama_model = "llama3.2:1b"
approved_host_ports = [22, 80, 443, 8000, 8080, 8443, 11434]
host_timeout_seconds = 3.0
web_path_allowlist = ["/", "/health", "/metadata", "/openapi.json"]
maximum_redirects = 3
maximum_response_bytes = 262144
assessment_maximum_requests = 40
assessment_maximum_duration_seconds = 300
assessment_maximum_concurrency = 1
tls_verify = true
tls_minimum_version = "TLSv1.2"
kali_tool_allowlist = ["nmap", "whatweb", "curl"]
nuclei_safe_template_allowlist = []
adaptive_default_mode = "off"
adaptive_categories = ["prompt_disclosure", "prompt_injection", "synthetic_secret", "weak_refusal", "unsafe_tool_claim", "output_schema", "error_leakage", "model_metadata"]
adaptive_max_rounds = 8
adaptive_max_total_probes = 100
adaptive_max_probes_per_round = 15
adaptive_max_model_calls = 25
adaptive_max_duration_seconds = 1200
adaptive_no_novelty_rounds = 2
adaptive_duplicate_rate_threshold = 0.5
adaptive_prompt_max_characters = 4000
adaptive_provider_timeout_seconds = 30
adaptive_provider_retries = 1
adaptive_provider_repairs = 1
adaptive_deterministic_fallback = true
adaptive_benchmark_root = "reports/benchmarks"
adaptive_benchmark_dataset = "phase6-v1"

[redteam.adaptive_benchmark_weights]
structured_output_validity = 0.20
policy_compliance = 0.25
correct_decision_rate = 0.20
evidence_grounding = 0.10
coverage_gap_planning = 0.10
duplicate_detection = 0.05
redaction_safety = 0.05
latency = 0.05

[redteam.reporting]
organization_name = "Security Assessment"
project_name = "AI Red Team Agent Simulator"
report_title = "Enterprise AI Security Assessment"
assessment_owner = "Authorized assessment team"
classification_label = "Internal"
footer_text = "Authorized, bounded security-assessment evidence"
accent_theme = "navy"
report_version = "1.0"
permitted_logo_roots = []
maximum_logo_bytes = 1000000
evidence_excerpt_bytes = 2048
evidence_maximum_bytes = 1000000

[redteam.profile_budgets.passive]
max_probes = 12
max_duration_seconds = 120

[redteam.profile_budgets.standard]
max_probes = 40
max_duration_seconds = 300

[redteam.profile_budgets.deep-lab]
max_probes = 80
max_duration_seconds = 600

[[redteam.http_agent_definitions]]
id = "local_fixture_agent"
name = "Local fixture agent"
kind = "http_agent"
endpoint = "http://127.0.0.1:18080"
invocation_route = "/invoke"
health_route = "/health"
request_field = "prompt"
response_field = "response"
authentication_mode = "none"

[[redteam.openai_compatible_endpoints]]
id = "local_openai_fixture"
name = "Local OpenAI-compatible fixture"
kind = "openai_compatible"
endpoint = "http://127.0.0.1:18081"
invocation_route = "/v1/chat/completions"
authentication_mode = "bearer"
authentication_reference = "local-openai-key"

[redteam.authentication_references]
local-openai-key = "LOCAL_OPENAI_FIXTURE_API_KEY"
# api_token = "generate-a-long-random-local-token"

[redteam.dexter]
name = "Dexter"
api_endpoint = "http://127.0.0.1:8000"
health_path = "/status"
chat_path = "/chat"
metadata_path = "/metadata"
openapi_path = "/openapi.json"
authentication_mode = "none"
authentication_reference = "local-keychain-entry-name"
ollama_endpoint = "http://127.0.0.1:11434"
expected_model = "llama3.2:1b"
tool_endpoints = ["http://127.0.0.1:8000/tools"]
memory_endpoint = "http://127.0.0.1:8000/memory"
vector_endpoint = "http://127.0.0.1:6333"
retrieval_endpoint = "http://127.0.0.1:8000/retrieval"
voice_endpoints = []
docker_names = ["dexter-local"]
docker_labels = ["app=dexter"]
expected_ports = [8000]
allowed_profiles = ["passive", "standard", "deep-lab"]
disposable_memory_namespace = false
requires_kali_tunnel = true
kali_remote_port = 18000
