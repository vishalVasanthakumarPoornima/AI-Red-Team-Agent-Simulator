name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall redteam_platform scanner targets functional_agents
      - run: ruff check redteam_platform tests
      - run: ruff format --check redteam_platform tests
      - run: mypy redteam_platform
      - run: coverage run -m unittest discover -s tests
      - run: coverage report
